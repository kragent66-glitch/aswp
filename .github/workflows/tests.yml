name: analysis

# The analysis suite is the only executable artifact in this repository, so it is
# the only thing CI can honestly verify. It runs the tests and then the three
# scripts, so a PR that breaks a regenerated table fails here rather than in a
# reader's terminal.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-and-scripts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Test suite
        run: python -m pytest -q
      - name: Analysis scripts (regenerate every documented table)
        run: |
          python analysis/p1_exact_power.py > /tmp/p1.txt
          python analysis/p23_match_curse.py > /tmp/p23.txt
          python analysis/p4_delta_criteria.py > /tmp/p4.txt
      - name: Show the tables this run produced
        run: cat /tmp/p1.txt /tmp/p23.txt /tmp/p4.txt
