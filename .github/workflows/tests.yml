name: tests

# Two jobs, because the repository now has two kinds of executable artifact:
#
#   pytest-and-scripts  the statistical analysis suite and its regenerated tables. Pure
#                       numpy/scipy, seconds to run -- kept fast so a PR gets feedback
#                       quickly.
#   bench               the reference benchmark: the frozen validation stream plus the
#                       evaluator whose scoring convention every published NLL depends
#                       on. Needs torch, hence a separate job rather than a tax on the
#                       fast one.
#
# The bench job runs with ASWP_BENCH_STRICT=1, which turns a skip into a failure. Without
# it, a job whose torch install silently failed would report green while the shift test
# and the frozen-stream invariants never ran -- exactly the coverage this job exists for.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-and-scripts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Test suite
        run: python -m pytest -q
      - name: Analysis scripts (regenerate every documented table)
        run: |
          python analysis/p1_exact_power.py > /tmp/p1.txt
          python analysis/p23_match_curse.py > /tmp/p23.txt
          python analysis/p4_delta_criteria.py > /tmp/p4.txt
      - name: Show the tables this run produced
        run: cat /tmp/p1.txt /tmp/p23.txt /tmp/p4.txt

  bench:
    name: bench (cpu torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies (CPU torch, no CUDA wheel)
        run: |
          python -m pip install --upgrade pip numpy transformers pytest
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -c "import torch, transformers; print('torch', torch.__version__, '| transformers', transformers.__version__)"
      - name: Freeze the validation token stream from its pinned revision
        run: python bench/freeze_stream.py
      - name: Verify the frozen stream against its committed record
        run: python bench/verify_stream.py --array-only
      - name: Test suite with skips treated as failures
        env:
          ASWP_BENCH_STRICT: "1"
        run: python -m pytest -q -rs
      - name: Confirm the torch-gated tests actually ran, not skipped
        run: |
          python - <<'PY'
          import json
          runs = json.load(open("bench/results/reference_results.json"))["runs"]
          print(f"{len(runs)} reference rows committed, each scored on:")
          for r in runs:
              print(" ", r["repo"], r["n_tokens_scored"], "tokens")
          PY
